<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It works! - demo.omnexlab.site</title>
<meta name="description" content="Demo site served from GitHub Pages on a free omnexlab.site subdomain.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f6f7fb; --surface:#fff; --fg:#101828; --muted:#566074; --line:#e2e6ee; --accent:#4f46e5; --accent2:#0d9488; --ok:#067647; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0e16; --surface:#121826; --fg:#e8ecf4; --muted:#98a3b8; --line:#222c3e; --accent:#8b93ff; --accent2:#35d0c6; --ok:#4fd18b; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  main { width:100%; max-width:520px; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:36px 28px; text-align:center; }
  .tick { display:inline-grid; place-items:center; width:56px; height:56px; border-radius:50%; background:color-mix(in srgb, var(--ok) 15%, transparent); color:var(--ok); }
  .tick svg { width:28px; height:28px; }
  h1 { font-size:2rem; letter-spacing:-.03em; margin:16px 0 6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:var(--muted); margin:6px 0; }
  .host { margin:18px 0 6px; display:inline-block; font-weight:600; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:6px 16px; word-break:break-all; }
  ul { list-style:none; padding:0; margin:20px 0 0; text-align:left; display:grid; gap:8px; }
  li { display:flex; gap:10px; align-items:flex-start; color:var(--muted); font-size:.95rem; }
  li::before { content:"\2713"; color:var(--ok); font-weight:700; }
  a { color:var(--accent); }
  .foot { margin-top:22px; font-size:.85rem; }
</style>
</head>
<body>
  <main>
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>It works!</h1>
    <p>This page is served from GitHub Pages on a free omnexlab.site subdomain.</p>
    <div class="host" id="host">demo.omnexlab.site</div>
    <ul>
      <li>Requested through a form, set up by a bot in about a minute</li>
      <li>HTTPS from the first visit, courtesy of Cloudflare</li>
      <li>No server to run, no cost</li>
    </ul>
    <p class="foot"><a href="https://omnexlab.site">Get your own at omnexlab.site</a></p>
  </main>
  <script>document.getElementById('host').textContent = location.hostname;</script>
</body>
</html>
