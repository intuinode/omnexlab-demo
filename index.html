<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It works! - demo.omnexlab.site</title>
<style>
  :root { --bg:#fff; --fg:#14171c; --muted:#5b6472; --ok:#1a7f4b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1319; --fg:#e8ecf2; --muted:#9aa5b5; --ok:#4fd18b; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; text-align:center; padding:16px; }
  h1 { font-size:2.2rem; margin:0 0 8px; color:var(--ok); }
  p { color:var(--muted); margin:4px 0; }
  code { background:rgba(127,127,127,.15); padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
  <main>
    <h1>It works!</h1>
    <p>This page is hosted on GitHub Pages and served from <code>demo.omnexlab.site</code>.</p>
    <p>The name came from a pull request to the omnexlab registry: no server, no sign-up.</p>
    <p id="host"></p>
  </main>
  <script>document.getElementById('host').textContent = 'You are on: ' + location.hostname;</script>
</body>
</html>
